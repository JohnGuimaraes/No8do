spring:
  application:
    name: no8do-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/no8do}
    username: ${DB_USER:no8do}
    password: ${DB_PASSWORD:no8do_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 'validate' porque o schema é controlado pelo Flyway, não pelo Hibernate.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

no8do:
  agent:
    presence:
      active-window: 2m
      disconnect-timeout: 5m
  google:
    client-id: ${NO8DO_GOOGLE_CLIENT_ID:}
    client-secret: ${NO8DO_GOOGLE_CLIENT_SECRET:}
  password-reset:
    from: ${SMTP_FROM:}
  registration:
    enabled: ${NO8DO_REGISTRATION_ENABLED:true}
  cors:
    allowed-origin: ${NO8DO_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  frontend-url: ${NO8DO_FRONTEND_URL:http://localhost:5173}
  github:
    oauth:
      redirect-uri: ${NO8DO_GITHUB_REDIRECT_URI:http://localhost:8080/api/account/integrations/github/callback}
    app:
      callback-url: ${NO8DO_GITHUB_APP_CALLBACK_URL:http://localhost:8080/api/account/integrations/github/app/callback}

logging:
  level:
    root: INFO
    com.no8do: DEBUG
