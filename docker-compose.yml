services:
  postgres:
    image: postgres:16-alpine
    container_name: no8do-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: no8do
      POSTGRES_USER: no8do
      POSTGRES_PASSWORD: no8do_dev
    ports:
      - "5432:5432"
    volumes:
      - no8do_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U no8do -d no8do"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  no8do_postgres_data:
    name: no8do_postgres_data
